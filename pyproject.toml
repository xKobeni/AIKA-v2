[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aika-ai-v2"
dynamic = ["version"]
description = "Local-first AIKA AI V2 runtime"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "psutil>=7,<8", "ddgs==9.16.1", "python-dotenv>=1,<2", "trafilatura>=2.1,<3", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["aika"]
packages = ["src", "src.intelligence", "src.storage", "src.memory", "src.capabilities"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
